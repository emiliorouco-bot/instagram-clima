name: Recordatorio Semanal de Publicación
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Ejecutar recordatorio semanal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python recordatorio_semanal.py
      - name: Guardar historial de fotos usadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_fotos.json || true
          git commit -m "Actualización historial de fotos usadas" || exit 0
          git push
