name: Generar Historia Diario

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Google Chrome y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install requests html2image

      - name: Ejecutar Script de Clima
        run: python generar_historia.py

      - name: Guardar imagen e historial actualizado en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_story.png historial_clima.json || true
          git commit -m "Actualización diaria del clima" || exit 0
          git push
